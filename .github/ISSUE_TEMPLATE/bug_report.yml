name: 🩸 Bug report
description: Something's broken or behaving unexpectedly
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file this. The more detail you give, the faster I can fix it.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Describe the bug as clearly as you can.
      placeholder: e.g. /hunt replied with "undefined is not a function" when I had no profile
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: e.g. The bot should auto-create a hunt profile on first run.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Be specific. "It crashes" is not steps.
      placeholder: |
        1. Run `npm start`
        2. In Discord, type `/hunt`
        3. ...
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node version
      description: Output of `node -v`
      placeholder: v20.10.0
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: OS
      placeholder: macOS 14, Ubuntu 22.04, Raspberry Pi OS, ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Paste anything the bot printed to the console. **Redact your token first.**
      render: shell
